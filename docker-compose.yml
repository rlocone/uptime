services:
  uptime-web:
    build: .
    ports:
      - "3011:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
    networks:
      - default
      - data_default
    restart: unless-stopped

networks:
  data_default:
    external: true
